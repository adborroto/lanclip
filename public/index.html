<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LanClip</title>
  <meta name="description" content="Self-hosted LAN clipboard — share text and code across your local network." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <!-- highlight.js — light theme (dark overridden via JS) -->
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css" />
  <link id="hljs-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" disabled />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo" aria-label="LanClip home">
        <span class="logo-icon" aria-hidden="true">📋</span>
        <span class="logo-text">LanClip</span>
      </a>

      <div class="search-wrap" role="search">
        <label for="search-input" class="sr-only">Search clips</label>
        <span class="search-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search clips…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search clips"
        />
        <button id="search-clear" class="search-clear hidden" aria-label="Clear search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="header-right">
        <span id="stats-badge" class="stats-badge" aria-live="polite"></span>
        <button id="theme-toggle" class="btn-icon" title="Toggle theme" aria-label="Toggle light/dark theme">
          <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────── -->
  <main class="main" id="main">

    <!-- Composer -->
    <section class="composer" id="composer" aria-label="New clip">
      <div class="composer-top">
        <span class="composer-label">New clip</span>
        <span id="composer-stats" class="composer-stats" aria-live="polite"></span>
      </div>
      <label for="clip-input" class="sr-only">Clip content</label>
      <textarea
        id="clip-input"
        class="clip-textarea"
        placeholder="Paste or type anything — code, commands, URLs, notes…"
        spellcheck="false"
        autocomplete="off"
        aria-label="Clip content"
      ></textarea>
      <div class="composer-bottom">
        <span class="kbd-hint" aria-hidden="true">
          <kbd>Ctrl</kbd><kbd>Enter</kbd> to save
        </span>
        <button id="save-btn" class="btn btn-primary" disabled aria-label="Save clip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Save
        </button>
      </div>
    </section>

    <!-- Clips list -->
    <section class="clips-section" aria-label="Clip history">
      <div class="clips-toolbar">
        <h2 id="clips-heading" class="clips-heading">Recent clips</h2>
        <button id="refresh-btn" class="btn-icon" title="Refresh" aria-label="Refresh clips">
          <svg id="refresh-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>

      <div id="clips-list" class="clips-list" role="list" aria-label="Clips"></div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state hidden" role="status">
        <div class="empty-icon" aria-hidden="true">📋</div>
        <p class="empty-title">No clips yet</p>
        <p class="empty-sub">
          Paste something above, or use <code>curl</code> from the terminal:
        </p>
        <pre class="empty-code">cat file.txt | curl -s -X POST http://&lt;your-ip&gt;:4040/api/clips \
  --data-binary @- -H "Content-Type: text/plain"</pre>
      </div>

      <!-- No search results -->
      <div id="no-results" class="empty-state hidden" role="status">
        <div class="empty-icon" aria-hidden="true">🔍</div>
        <p class="empty-title">No results found</p>
        <p class="empty-sub">Try a different keyword</p>
      </div>

      <!-- Load more -->
      <div id="load-more-wrap" class="load-more-wrap hidden">
        <button id="load-more-btn" class="btn btn-secondary">Load more</button>
      </div>
    </section>

  </main>

  <!-- ── Modal (full clip view) ─────────────────────── -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-label">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-meta" id="modal-label">
          <span id="modal-lang" class="lang-badge hidden"></span>
          <span id="modal-ip"   class="meta-chip"></span>
          <span id="modal-time" class="meta-chip"></span>
          <span id="modal-size" class="meta-chip"></span>
        </div>
        <div class="modal-actions">
          <button id="modal-copy-btn" class="btn btn-secondary btn-sm">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy
          </button>
          <button id="modal-delete-btn" class="btn btn-danger btn-sm">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            Delete
          </button>
          <button id="modal-close-btn" class="btn-icon" aria-label="Close">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <pre class="modal-pre"><code id="modal-content" class="modal-content"></code></pre>
    </div>
  </div>

  <!-- ── Toasts ──────────────────────────────────────── -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
